# CI for psstools/pss-scrambler.
#
# Before this commit both publish steps fired on `refs/heads/main` -- the
# branch a five-minute mirror cycle moves. Publishing is now conditional on
# BOTH a v* tag and the release-authority master switch at
# https://dvkit.org/.well-known/release-authority.json, resolved in a separate
# `gate` job because an `if:` on a job cannot reference a step in its own job.

name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused, and the VS Code
            # Marketplace does not even allow the yank.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci-linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    - name: Configure Python
      # DEVELOPMENT BUILDS ARE NOW UNPUBLISHABLE, not merely unpublished.
      #
      # setup.py appends ".$BUILD_NUM" to the version when BUILD_NUM is set,
      # so this used to produce 0.0.2.<run-id> -- a perfectly valid and
      # perfectly uploadable PyPI version, which the branch-gated step below
      # then uploaded. PyPI holds 0.0.2.4632135087 from exactly that path.
      #
      # ".dev<run-id>+gh" is a PEP 440 LOCAL VERSION SEGMENT (the part after
      # the '+'). PyPI rejects any upload carrying one, outright, at the tool.
      # The tag gate on the publish step is the control; this is the backstop
      # for the day someone edits that gate. `.dev` also sorts BELOW the
      # release it derives from. The `+gh` platform tag matters because
      # GITHUB_RUN_ID is not unique across forges.
      #
      # On a v* tag BUILD_NUM is left unset, so setup.py uses the version
      # exactly as committed.
      run: |
        # Install dependencies required to load ivpm.yaml file.
        #
        # importlib_metadata is installed EXPLICITLY. ivpm 2.24.0 does
        # `from importlib_metadata import entry_points` unconditionally, and
        # does not declare the backport as a dependency -- on Python 3.9,
        # which this job pins, the stdlib module is `importlib.metadata` and
        # the backport is absent, so `ivpm update` exits 1 with a traceback.
        # The first Actions run this repository ever had, on 2026-08-31,
        # failed exactly there. This is a workaround at the call site; the
        # defect is in ivpm's packaging and is recorded upstream of here.
        python3 -m pip install ivpm importlib_metadata
        python3 -m ivpm update
        case "$GITHUB_REF" in
          refs/tags/v*) echo "tag build -- leaving the version as committed" ;;
          *) export BUILD_NUM="dev${GITHUB_RUN_ID}+gh" ;;
        esac
        ./packages/python/bin/python3 setup.py bdist_wheel --universal
        ls dist/

    - name: Build Docs
      run: |
        ./packages/python/bin/sphinx-build -M html ./doc/source build
        touch build/html/.nojekyll

    - name: Check the tag matches the package version
      # Guards against tagging v0.0.3 while setup.py still says 0.0.2, which
      # would publish a release under the wrong number -- and PyPI lets a
      # version be yanked, never reused.
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        ver=$(sed -n 's/^version="\(.*\)"/\1/p' setup.py)
        echo "tag=$tag  setup.py=$ver"
        if [ "$tag" != "$ver" ]; then
          echo "::error::tag v$tag does not match version $ver in setup.py"
          exit 1
        fi

    - name: Publish to PyPi
      # WAS: `startsWith(github.ref, 'refs/heads/main')`.
      #
      # Both halves are required and neither is redundant:
      #
      #   startsWith(github.ref, 'refs/tags/v')  -- a release is a deliberate
      #     tag, so no mirrored commit can trigger one.
      #   needs.gate.outputs.authority == 'github'  -- the master switch
      #     decides WHICH forge releases this repo. Flipping it in
      #     sync-policy.toml moves the release with no edit to this file.
      #
      # `needs: gate` is declared on this job. Without it the expression reads
      # an empty string, is false forever, and publishes nothing while going
      # green -- see the note on the gate job.
      if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    # A "Publish Docs" step stood here, deploying build/html to gh-pages on
    # every push to main. Deleted rather than tag-gated: dvkit.org owns
    # documentation for this estate -- docs are not a release, so they should
    # publish whichever forge holds release authority, which a step gated on
    # the release trigger cannot do -- and per-repo Pages sites are being
    # retired estate-wide. Re-arming this one on a tag would resurrect a site
    # that is on the list to be turned off.
    #
    # The Sphinx build above stays as a CI check, with the assertion below,
    # since the deploy used to be the only thing that would have noticed it
    # producing nothing.
    - name: Sanity-check the docs build
      run: |
        test -s build/html/index.html \
          || { echo "::error::no index.html in the docs build output"; exit 1; }
        echo "generated pages: $(find build/html -name '*.html' | wc -l)"


