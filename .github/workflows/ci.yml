# CI for psstools/pss-scrambler.
#
# Before this commit both publish steps fired on `refs/heads/main` -- the
# branch a five-minute mirror cycle moves. Publishing is now conditional on
# BOTH a v* tag and the release-authority master switch at
# https://dvkit.org/.well-known/release-authority.json, resolved in a separate
# `gate` job because an `if:` on a job cannot reference a step in its own job.

name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused, and the VS Code
            # Marketplace does not even allow the yank.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci-linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    - name: Stamp version
      # THE TAG IS THE VERSION. On a `v*` build this substitutes the tag into
      # src/pss_scrambler/__version__.py; everything else gets a dev version
      # derived from the 0.0.0 placeholder that is committed. There is no
      # version to bump before tagging and nothing in the tree to keep in step
      # with the tag.
      #
      # This replaced a hand-maintained `version="0.0.2"` in setup.py plus a
      # "Check the tag matches the package version" step that failed the
      # release when the two disagreed. That check was correct and guarded
      # against forgetting to hand-edit a file -- a step that should not
      # exist. Substituting removes the step and the check together.
      #
      # DEVELOPMENT BUILDS ARE UNPUBLISHABLE, not merely unpublished.
      # ".dev<run-id>+gh" carries a PEP 440 LOCAL VERSION SEGMENT (the part
      # after the '+'), which PyPI rejects outright at the tool. The tag gate
      # on the publish step is the control; this is the backstop for the day
      # someone edits that gate. `.dev` also sorts BELOW the release it
      # derives from, and `+gh` matters because GITHUB_RUN_ID is not unique
      # across forges. PyPI holds 0.0.2.4632135087 from before this was true.
      #
      # Written through a temp file rather than with `sed -i`, whose argument
      # handling differs between GNU and BSD -- so this form needs no
      # per-platform variant.
      run: |
        set -eu
        f=src/pss_scrambler/__version__.py
        case "$GITHUB_REF" in
          refs/tags/v*)
            v="${GITHUB_REF#refs/tags/v}"
            # THE TAG IS SPELLED THE PEP 440 WAY -- v0.0.3, v0.0.3rc1 -- and
            # goes into the file VERBATIM, so git tag, PyPI version and wheel
            # filename are one identical string with no transformation
            # anywhere between them. `rc` only; alpha and beta are not
            # accepted because nothing has asked for them.
            bad=0
            case "$v" in
              *rc*)
                core="${v%rc*}"
                rcnum="${v##*rc}"
                case "$core"  in ''|*[!0-9.]*) bad=1 ;; esac
                case "$rcnum" in ''|*[!0-9]*)  bad=1 ;; esac
                ;;
              *)
                case "$v" in ''|*[!0-9.]*) bad=1 ;; esac
                ;;
            esac
            if [ "$bad" -ne 0 ]; then
              echo "::error::tag v$v is not <major>.<minor>.<patch> or <major>.<minor>.<patch>rc<N> (PEP 440 spelling: v0.0.3rc1, not v0.0.3-rc1)"
              exit 1
            fi
            new="$v"
            ;;
          *)
            new="0.0.0.dev${GITHUB_RUN_ID}+gh"
            ;;
        esac
        sed 's/^__version__ = .*$/__version__ = "'"$new"'"/' "$f" > "$f.stamped"
        mv "$f.stamped" "$f"
        # ANTI-VACUITY. A sed whose pattern matches nothing exits 0 and leaves
        # the file untouched, so renaming or reformatting __version__.py would
        # turn this step into a silent no-op and ship the 0.0.0 placeholder as
        # a release.
        grep -q "^__version__ = \"$new\"\$" "$f" || {
          echo "::error::failed to stamp version $new into $f"
          exit 1
        }
        grep '^__version__ = ' "$f"

    - name: Build the wheel
      # `python -m build` with build isolation, NOT `setup.py bdist_wheel`.
      # setup.py is gone: all metadata lives in pyproject.toml, which is the
      # only way to emit PEP 639's `License-Expression`. Isolation matters
      # here because [build-system] requires setuptools>=77 for that field,
      # and the ivpm-provisioned interpreter carries whatever setuptools it
      # happens to have.
      run: |
        # Install dependencies required to load ivpm.yaml file.
        #
        # importlib_metadata is installed EXPLICITLY. ivpm 2.24.0 does
        # `from importlib_metadata import entry_points` unconditionally, and
        # does not declare the backport as a dependency -- on Python 3.9,
        # which this job pins, the stdlib module is `importlib.metadata` and
        # the backport is absent, so `ivpm update` exits 1 with a traceback.
        # The first Actions run this repository ever had, on 2026-08-31,
        # failed exactly there. This is a workaround at the call site; the
        # defect is in ivpm's packaging and is recorded upstream of here.
        python3 -m pip install ivpm importlib_metadata
        python3 -m ivpm update
        ./packages/python/bin/python3 -m pip install build
        ./packages/python/bin/python3 -m build --wheel
        ls dist/

    - name: Check the wheel carries the metadata it is supposed to
      # The migration off setup.py is exactly the change that drops metadata
      # silently: once a [project] table exists, setuptools IGNORES fields it
      # could have carried, with a warning rather than an error. A wheel
      # missing Requires-Dist or Requires-Python installs fine and fails later
      # on someone else's machine, so the assertions are here rather than in
      # a reviewer's head.
      run: |
        set -eu
        python3 -m pip install --quiet --upgrade pip
        python3 - <<'PY'
        import glob, sys, zipfile

        whl = glob.glob("dist/*.whl")
        assert len(whl) == 1, f"expected exactly one wheel, found {whl}"
        with zipfile.ZipFile(whl[0]) as z:
            names = z.namelist()
            meta = next(n for n in names if n.endswith(".dist-info/METADATA"))
            text = z.read(meta).decode()

        missing = [f for f in (
            "Name: pss-scrambler",
            "License-Expression: Apache-2.0",
            "Requires-Python: >=3.9",
            "Author-email: Matthew Ballance",
            "Summary: ",
        ) if f not in text]
        # Every module the package had before the migration, plus the version
        # module. A `find` misconfiguration produces a wheel with no code in
        # it and no error saying so -- this is what notices.
        for mod in ("__main__", "__version__", "dictionary",
                    "pss_keywords", "translator"):
            if f"pss_scrambler/{mod}.py" not in names:
                missing.append(f"module pss_scrambler/{mod}.py")
        if "pss_scrambler/cmds/cmd_encode.py" not in names:
            missing.append("module pss_scrambler/cmds/cmd_encode.py")
        if not any(n.endswith("entry_points.txt") for n in names):
            missing.append("entry_points.txt (console script)")
        for lic in ("LICENSE", "NOTICE"):
            if not any(n.endswith(f"licenses/{lic}") for n in names):
                missing.append(f"{lic} (Apache-2.0 section 4(d))")

        if missing:
            for m in missing:
                print(f"::error::wheel is missing: {m}")
            sys.exit(1)
        print(f"OK: {whl[0]} carries all expected metadata and modules")
        PY

    - name: Build Docs
      run: |
        ./packages/python/bin/sphinx-build -M html ./doc/source build
        touch build/html/.nojekyll

    # A "Check the tag matches the package version" step stood here, comparing
    # the tag against a hand-maintained `version=` in setup.py. It is gone
    # because what it checked can no longer disagree: the "Stamp version" step
    # puts the tag INTO the package, and its anti-vacuity grep fails the build
    # if that substitution did not happen. The wheel filename is now derived
    # from the tag rather than compared against it.

    - name: Publish to PyPi
      # WAS: `startsWith(github.ref, 'refs/heads/main')`.
      #
      # Both halves are required and neither is redundant:
      #
      #   startsWith(github.ref, 'refs/tags/v')  -- a release is a deliberate
      #     tag, so no mirrored commit can trigger one.
      #   needs.gate.outputs.authority == 'github'  -- the master switch
      #     decides WHICH forge releases this repo. Flipping it in
      #     sync-policy.toml moves the release with no edit to this file.
      #
      # `needs: gate` is declared on this job. Without it the expression reads
      # an empty string, is false forever, and publishes nothing while going
      # green -- see the note on the gate job.
      if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    # A "Publish Docs" step stood here, deploying build/html to gh-pages on
    # every push to main. Deleted rather than tag-gated: dvkit.org owns
    # documentation for this estate -- docs are not a release, so they should
    # publish whichever forge holds release authority, which a step gated on
    # the release trigger cannot do -- and per-repo Pages sites are being
    # retired estate-wide. Re-arming this one on a tag would resurrect a site
    # that is on the list to be turned off.
    #
    # The Sphinx build above stays as a CI check, with the assertion below,
    # since the deploy used to be the only thing that would have noticed it
    # producing nothing.
    - name: Sanity-check the docs build
      run: |
        test -s build/html/index.html \
          || { echo "::error::no index.html in the docs build output"; exit 1; }
        echo "generated pages: $(find build/html -name '*.html' | wc -l)"


